<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invite list · POAP</title>
<style>
/* The invite list for an event: the emails the volunteer app accepts at the
   door. Same tokens as /admin. Signs in with the desk login. */
:root{
  --font-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --paper:#faf9f7; --surface:#ffffff; --surface-2:#f4f2ef; --ink:#1c1b1a; --ink-2:#57544f; --ink-3:#8a8681;
  --rule:#eceae6; --rule-2:#ddd9d3; --signal:#b4552d; --signal-wash:rgba(180,85,45,.09);
  --jade:#16794f; --jade-wash:rgba(22,121,79,.09);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#141413; --surface:#1c1c1b; --surface-2:#232322; --ink:#f2f0ed; --ink-2:#b3afa8; --ink-3:#8a8681;
    --rule:#2c2b29; --rule-2:#3b3a37; --signal:#e08b5f; --signal-wash:rgba(224,139,95,.12); --jade:#4fbd8b; --jade-wash:rgba(79,189,139,.12) }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-display);font-size:15px;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:30px;font-weight:800;letter-spacing:-1px;margin:0 0 6px}
.lede{color:var(--ink-2);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:13px;color:var(--ink-2);margin:0 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px}
textarea{min-height:160px;font-family:var(--font-mono);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 200px}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid transparent;padding:10px 18px;background:var(--ink);color:var(--paper);cursor:pointer}
button.quiet{background:transparent;color:var(--ink-2);border-color:var(--rule-2);padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.note{border-left:4px solid var(--ink-3);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:12px 0 0}
.note.ok{border-color:var(--jade);background:var(--jade-wash)} .note.bad{border-color:var(--signal);background:var(--signal-wash)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--ink-3);font-weight:600;font-size:12.5px}
code{font-family:var(--font-mono);font-size:12.5px;word-break:break-all}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.yes{color:var(--jade);background:var(--jade-wash)} .pill.no{color:var(--ink-3);background:var(--surface-2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Invite list</h1>
  <p class="lede">The emails the volunteer app accepts at the door. Each one gets a wallet there, and its address is saved here.</p>

  <section class="card" id="signin" hidden>
    <p style="margin-top:0">Sign in with the desk login.</p>
    <div class="row">
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
      <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
      <div style="flex:0 0 auto"><button id="login">Sign in</button></div>
    </div>
    <div id="login-note" class="note bad" hidden></div>
  </section>

  <div id="app" hidden>
    <section class="card">
      <label for="event">Event</label>
      <select id="event"></select>
    </section>

    <section class="card">
      <label for="text">Add people — one per line: <code>email</code> or <code>email, name</code></label>
      <textarea id="text" placeholder="ada@example.com, Ada Lovelace&#10;grace@example.com"></textarea>
      <div style="margin-top:12px"><button id="add">Add to the list</button></div>
      <div id="add-note" class="note" hidden></div>
    </section>

    <section class="card">
      <div class="row" style="align-items:center;margin-bottom:6px">
        <strong id="count">—</strong>
        <div style="flex:0 0 auto"><button class="quiet" id="refresh">Refresh</button></div>
      </div>
      <table>
        <thead><tr><th>Email</th><th>Name</th><th>Wallet</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </div>
</main>
<script>
(function () {
  "use strict";
  var csrf = "";
  function $(id) { return document.getElementById(id); }
  function api(method, path, body) {
    var headers = { accept: "application/json" };
    if (body !== undefined) headers["content-type"] = "application/json";
    if (method !== "GET" && csrf) headers["x-csrf-token"] = csrf;
    return fetch(path, { method: method, headers: headers, credentials: "same-origin",
      body: body === undefined ? undefined : JSON.stringify(body) })
      .then(function (r) { return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = null; }
        return { ok: r.ok, status: r.status, json: j };
      }); });
  }
  function note(id, text, tone) {
    var n = $(id); n.textContent = text; n.className = "note" + (tone ? " " + tone : ""); n.hidden = !text;
  }
  function errText(r) { return (r.json && r.json.error && r.json.error.message) || ("Request failed (" + r.status + ")."); }

  function start() {
    api("GET", "/admin/api/me").then(function (r) {
      if (r.ok && r.json) { csrf = r.json.csrf || ""; showApp(); }
      else { $("signin").hidden = false; }
    });
  }

  $("login").addEventListener("click", function () {
    $("login").disabled = true;
    api("POST", "/admin/api/login", { email: $("email").value.trim(), password: $("password").value })
      .then(function (r) {
        $("login").disabled = false;
        if (!r.ok) { note("login-note", errText(r), "bad"); return; }
        csrf = (r.json && r.json.csrf) || "";
        $("signin").hidden = true; showApp();
      });
  });

  function showApp() {
    $("app").hidden = false;
    api("GET", "/admin/api/events?limit=200").then(function (r) {
      var sel = $("event"); sel.innerHTML = "";
      var list = (r.json && r.json.events) || [];
      list.sort(function (a, b) { return b.eventId - a.eventId; });
      list.forEach(function (e) {
        var o = document.createElement("option");
        o.value = e.eventId; o.textContent = e.eventId + " — " + e.name + " (" + e.status + ")";
        sel.appendChild(o);
      });
      var saved = null; try { saved = localStorage.getItem("invitees.event"); } catch (e) {}
      if (saved && list.some(function (e) { return String(e.eventId) === saved; })) sel.value = saved;
      load();
    });
  }

  function eventId() { return $("event").value; }

  function load() {
    if (!eventId()) return;
    try { localStorage.setItem("invitees.event", eventId()); } catch (e) {}
    api("GET", "/admin/api/events/" + eventId() + "/invitees").then(function (r) {
      var rows = $("rows"); rows.innerHTML = "";
      var list = (r.json && r.json.invitees) || [];
      var withWallet = list.filter(function (i) { return i.address; }).length;
      $("count").textContent = list.length + " invited · " + withWallet + " with a wallet";
      list.forEach(function (i) {
        var tr = document.createElement("tr");
        var td1 = document.createElement("td"); td1.textContent = i.email;
        var td2 = document.createElement("td"); td2.textContent = i.displayName || "—";
        var td3 = document.createElement("td");
        if (i.address) { var c = document.createElement("code"); c.textContent = i.address; td3.appendChild(c); }
        else { var p = document.createElement("span"); p.className = "pill no"; p.textContent = "not yet"; td3.appendChild(p); }
        var td4 = document.createElement("td");
        var b = document.createElement("button"); b.className = "quiet"; b.textContent = "Remove";
        b.addEventListener("click", function () {
          if (!confirm("Take " + i.email + " off the list?")) return;
          api("DELETE", "/admin/api/events/" + eventId() + "/invitees/" + encodeURIComponent(i.email)).then(load);
        });
        td4.appendChild(b);
        [td1, td2, td3, td4].forEach(function (td) { tr.appendChild(td); });
        rows.appendChild(tr);
      });
    });
  }

  $("event").addEventListener("change", load);
  $("refresh").addEventListener("click", load);
  $("add").addEventListener("click", function () {
    var text = $("text").value;
    if (!text.trim()) return;
    $("add").disabled = true;
    api("POST", "/admin/api/events/" + eventId() + "/invitees", { text: text }).then(function (r) {
      $("add").disabled = false;
      if (!r.ok) { note("add-note", errText(r), "bad"); return; }
      var j = r.json;
      var msg = j.added + " added" + (j.alreadyListed ? ", " + j.alreadyListed + " already on the list" : "") +
        (j.rejected && j.rejected.length ? ". Not an email: " + j.rejected.join(" | ") : ".");
      note("add-note", msg, j.rejected && j.rejected.length ? "bad" : "ok");
      $("text").value = "";
      load();
    });
  });

  start();
})();
</script>
</body>
</html>
