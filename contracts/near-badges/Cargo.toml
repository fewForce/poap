[package]
name = "near-badges"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Soulbound attendance badges for poap.live events on NEAR"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.27.0"

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
